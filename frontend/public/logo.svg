<svg
  width="500"
  height="160"
  viewBox="0 0 500 160"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Dark logo background -->
  <rect
    x="0"
    y="0"
    width="500"
    height="160"
    rx="14"
    fill="#0D1824"
  />

  <!-- Shield -->
  <path
    d="M80 29
       L120 45
       L120 78
       C120 105 103 120 80 131
       C57 120 40 105 40 78
       L40 45
       L80 29Z"
    fill="#0D9488"
  />

  <!-- Check mark -->
  <path
    d="M58 78
       L73 93
       L103 59"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- VeriFit wordmark -->
  <text
    x="145"
    y="99"
    fill="#FFFFFF"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="56"
    font-weight="700"
    letter-spacing="-2.5"
  >
    VeriFit
  </text>
</svg>